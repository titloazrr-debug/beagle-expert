<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Logo Beagle">
  <!-- Soft background circle -->
  <circle cx="32" cy="32" r="30" fill="#2f5d3a"/>
  <!-- Left ear -->
  <ellipse cx="14" cy="34" rx="10" ry="18" fill="#5c3a1e" transform="rotate(-18 14 34)"/>
  <ellipse cx="14.5" cy="34" rx="6.5" ry="13" fill="#8b5a2b" transform="rotate(-18 14.5 34)"/>
  <!-- Right ear -->
  <ellipse cx="50" cy="34" rx="10" ry="18" fill="#5c3a1e" transform="rotate(18 50 34)"/>
  <ellipse cx="49.5" cy="34" rx="6.5" ry="13" fill="#8b5a2b" transform="rotate(18 49.5 34)"/>
  <!-- Head -->
  <ellipse cx="32" cy="34" rx="18" ry="17" fill="#f4e4c8"/>
  <!-- Brown patches over eyes -->
  <ellipse cx="22" cy="28" rx="7" ry="6.5" fill="#8b5a2b"/>
  <ellipse cx="42" cy="28" rx="7" ry="6.5" fill="#8b5a2b"/>
  <!-- White muzzle blaze -->
  <ellipse cx="32" cy="38" rx="10" ry="9" fill="#fffaf3"/>
  <path d="M26 24c2-4 4.5-6 6-6s4 2 6 6" fill="#fffaf3"/>
  <!-- Eyes -->
  <circle cx="24" cy="30" r="2.4" fill="#2c2118"/>
  <circle cx="40" cy="30" r="2.4" fill="#2c2118"/>
  <circle cx="24.7" cy="29.3" r="0.7" fill="#fffaf3"/>
  <circle cx="40.7" cy="29.3" r="0.7" fill="#fffaf3"/>
  <!-- Nose -->
  <ellipse cx="32" cy="40" rx="3.2" ry="2.4" fill="#2c2118"/>
  <ellipse cx="31.2" cy="39.4" rx="0.7" ry="0.45" fill="#6b5748" opacity="0.5"/>
  <!-- Smile -->
  <path d="M27 44c2.2 2.2 5.8 2.2 8 0" fill="none" stroke="#2c2118" stroke-width="1.4" stroke-linecap="round"/>
  <!-- Cheek dots -->
  <circle cx="22" cy="40" r="1.1" fill="#e8b4a0" opacity="0.7"/>
  <circle cx="42" cy="40" r="1.1" fill="#e8b4a0" opacity="0.7"/>
</svg>
